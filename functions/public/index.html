<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone Validator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #countryDropdown {
            max-height: 240px;
            overflow-y: auto;
        }

        #countryDropdown::-webkit-scrollbar {
            width: 4px;
        }

        #countryDropdown::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        .country-option:hover {
            background: #f1f5f9;
        }

        .country-option.selected {
            background: #eff6ff;
        }
    </style>
</head>

<body class="bg-slate-50 flex items-center justify-center min-h-screen font-sans text-slate-800">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-100">
        <div class="text-center mb-6">
            <h2 class="text-2xl font-bold text-slate-900">Sign Up</h2>
            <p class="text-slate-500 text-sm mt-1">Enter your phone number to continue.</p>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Phone Number</label>

                <!-- Country + Number row -->
                <div class="flex gap-2">

                    <!-- Country code picker -->
                    <div class="relative" id="countryPickerWrapper">
                        <button type="button" id="countryPickerBtn"
                            class="flex items-center gap-1.5 h-full px-3 py-3 border border-slate-300 rounded-lg bg-slate-50 hover:bg-slate-100 focus:ring-2 focus:ring-blue-500 outline-none transition-all text-sm font-medium whitespace-nowrap min-w-[90px]">
                            <span id="selectedFlag">🌐</span>
                            <span id="selectedCode" class="text-slate-600">+?</span>
                            <svg class="w-3 h-3 text-slate-400 ml-auto" fill="none" stroke="currentColor"
                                viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M19 9l-7 7-7-7" />
                            </svg>
                        </button>

                        <!-- Dropdown panel -->
                        <div id="countryDropdownPanel"
                            class="hidden absolute left-0 top-full mt-1 z-50 w-72 bg-white border border-slate-200 rounded-xl shadow-lg">
                            <div class="p-2 border-b border-slate-100">
                                <input type="text" id="countrySearch" placeholder="Search country..."
                                    class="w-full px-3 py-1.5 text-sm border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-400 bg-slate-50">
                            </div>
                            <ul id="countryDropdown" class="py-1"></ul>
                        </div>
                    </div>

                    <!-- Phone number input -->
                    <input type="tel" id="phoneInput" placeholder="7700 900000"
                        class="flex-1 border border-slate-300 px-4 py-3 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all bg-slate-50 text-sm">
                </div>

                <p class="text-xs text-slate-400 mt-1">Enter the phone number and we'll clean it up.</p>
            </div>

            <button id="validateBtn"
                class="w-full bg-blue-600 text-white font-medium px-4 py-3 rounded-lg hover:bg-blue-700 focus:ring-4 focus:ring-blue-100 transition-all">
                Validate Number
            </button>

            <div id="resultContainer" class="hidden mt-4 p-4 rounded-lg border">
                <p id="resultText" class="text-sm"></p>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-functions.js";

        const firebaseConfig = {
            projectId: "fir-vonage-demo-123",
            apiKey: "d7fb17720f81be75d1456e3550643f3eb872c2c9"
        };

        const app = initializeApp(firebaseConfig);
        const functions = getFunctions(app);
        const validatePhone = httpsCallable(functions, 'validatePhone');

        // ── Country list (flag, name, dial code) ──────────────────────────────
        const COUNTRIES = [
            { flag: '🇬🇧', name: 'United Kingdom', code: '+44' },
            { flag: '🇺🇸', name: 'United States', code: '+1' },
            { flag: '🇨🇦', name: 'Canada', code: '+1' },
            { flag: '🇦🇺', name: 'Australia', code: '+61' },
            { flag: '🇮🇳', name: 'India', code: '+91' },
            { flag: '🇩🇪', name: 'Germany', code: '+49' },
            { flag: '🇫🇷', name: 'France', code: '+33' },
            { flag: '🇪🇸', name: 'Spain', code: '+34' },
            { flag: '🇮🇹', name: 'Italy', code: '+39' },
            { flag: '🇳🇱', name: 'Netherlands', code: '+31' },
            { flag: '🇧🇪', name: 'Belgium', code: '+32' },
            { flag: '🇵🇹', name: 'Portugal', code: '+351' },
            { flag: '🇨🇭', name: 'Switzerland', code: '+41' },
            { flag: '🇦🇹', name: 'Austria', code: '+43' },
            { flag: '🇸🇪', name: 'Sweden', code: '+46' },
            { flag: '🇩🇰', name: 'Denmark', code: '+45' },
            { flag: '🇳🇴', name: 'Norway', code: '+47' },
            { flag: '🇫🇮', name: 'Finland', code: '+358' },
            { flag: '🇮🇪', name: 'Ireland', code: '+353' },
            { flag: '🇵🇱', name: 'Poland', code: '+48' },
            { flag: '🇨🇿', name: 'Czech Republic', code: '+420' },
            { flag: '🇷🇴', name: 'Romania', code: '+40' },
            { flag: '🇭🇺', name: 'Hungary', code: '+36' },
            { flag: '🇬🇷', name: 'Greece', code: '+30' },
            { flag: '🇹🇷', name: 'Turkey', code: '+90' },
            { flag: '🇷🇺', name: 'Russia', code: '+7' },
            { flag: '🇺🇦', name: 'Ukraine', code: '+380' },
            { flag: '🇿🇦', name: 'South Africa', code: '+27' },
            { flag: '🇳🇬', name: 'Nigeria', code: '+234' },
            { flag: '🇰🇪', name: 'Kenya', code: '+254' },
            { flag: '🇬🇭', name: 'Ghana', code: '+233' },
            { flag: '🇪🇬', name: 'Egypt', code: '+20' },
            { flag: '🇲🇦', name: 'Morocco', code: '+212' },
            { flag: '🇧🇷', name: 'Brazil', code: '+55' },
            { flag: '🇲🇽', name: 'Mexico', code: '+52' },
            { flag: '🇦🇷', name: 'Argentina', code: '+54' },
            { flag: '🇨🇴', name: 'Colombia', code: '+57' },
            { flag: '🇨🇱', name: 'Chile', code: '+56' },
            { flag: '🇯🇵', name: 'Japan', code: '+81' },
            { flag: '🇰🇷', name: 'South Korea', code: '+82' },
            { flag: '🇨🇳', name: 'China', code: '+86' },
            { flag: '🇸🇬', name: 'Singapore', code: '+65' },
            { flag: '🇭🇰', name: 'Hong Kong', code: '+852' },
            { flag: '🇲🇾', name: 'Malaysia', code: '+60' },
            { flag: '🇮🇩', name: 'Indonesia', code: '+62' },
            { flag: '🇵🇭', name: 'Philippines', code: '+63' },
            { flag: '🇹🇭', name: 'Thailand', code: '+66' },
            { flag: '🇻🇳', name: 'Vietnam', code: '+84' },
            { flag: '🇵🇰', name: 'Pakistan', code: '+92' },
            { flag: '🇧🇩', name: 'Bangladesh', code: '+880' },
            { flag: '🇦🇪', name: 'UAE', code: '+971' },
            { flag: '🇸🇦', name: 'Saudi Arabia', code: '+966' },
            { flag: '🇮🇱', name: 'Israel', code: '+972' },
            { flag: '🇮🇶', name: 'Iraq', code: '+964' },
            { flag: '🇮🇷', name: 'Iran', code: '+98' },
            { flag: '🇳🇿', name: 'New Zealand', code: '+64' },
        ].sort((a, b) => a.name.localeCompare(b.name));

        // ── Render country list ───────────────────────────────────────────────
        let selectedCountry = null;

        function renderCountries(filter = '') {
            const list = document.getElementById('countryDropdown');
            const filtered = filter
                ? COUNTRIES.filter(c => c.name.toLowerCase().includes(filter.toLowerCase()) || c.code.includes(filter))
                : COUNTRIES;

            list.innerHTML = filtered.map((c, i) => `
                <li class="country-option flex items-center gap-2 px-3 py-2 cursor-pointer text-sm ${selectedCountry === c ? 'selected' : ''}"
                    data-index="${COUNTRIES.indexOf(c)}">
                    <span>${c.flag}</span>
                    <span class="flex-1 text-slate-700">${c.name}</span>
                    <span class="text-slate-400 text-xs">${c.code}</span>
                </li>
            `).join('');

            list.querySelectorAll('.country-option').forEach(el => {
                el.addEventListener('click', () => {
                    selectedCountry = COUNTRIES[+el.dataset.index];
                    document.getElementById('selectedFlag').textContent = selectedCountry.flag;
                    document.getElementById('selectedCode').textContent = selectedCountry.code;
                    closeDropdown();
                });
            });
        }

        function closeDropdown() {
            document.getElementById('countryDropdownPanel').classList.add('hidden');
            document.getElementById('countrySearch').value = '';
            renderCountries();
        }

        // Toggle open/close
        document.getElementById('countryPickerBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            const panel = document.getElementById('countryDropdownPanel');
            const isHidden = panel.classList.contains('hidden');
            if (isHidden) {
                panel.classList.remove('hidden');
                document.getElementById('countrySearch').focus();
            } else {
                closeDropdown();
            }
        });

        // Live search
        document.getElementById('countrySearch').addEventListener('input', (e) => {
            renderCountries(e.target.value);
        });

        // Close on outside click
        document.addEventListener('click', (e) => {
            if (!document.getElementById('countryPickerWrapper').contains(e.target)) {
                closeDropdown();
            }
        });

        // Initial render
        renderCountries();

        // ── Validation ────────────────────────────────────────────────────────
        document.getElementById('validateBtn').addEventListener('click', async () => {
            const rawInput = document.getElementById('phoneInput').value.trim();
            const btn = document.getElementById('validateBtn');
            const resultContainer = document.getElementById('resultContainer');
            const resultText = document.getElementById('resultText');

            // Build the full number: prepend selected dial code (digits only from input)
            const localDigits = rawInput.replace(/[^\d]/g, '');
            let phone;

            if (selectedCountry) {
                // Strip leading 0 (common local format like 07700...) before prepending
                const stripped = localDigits.replace(/^0+/, '');
                phone = selectedCountry.code.replace('+', '') + stripped;
            } else {
                phone = rawInput; // pass as-is and let backend sanitise
            }

            // Loading state
            btn.innerText = 'Validating...';
            btn.disabled = true;
            btn.classList.add('opacity-75');
            resultContainer.classList.add('hidden');

            try {
                const response = await validatePhone({ phone });
                const data = response.data;

                resultContainer.classList.remove('hidden');

                if (data.valid) {
                    const isMobile = data.networkType && data.networkType.toLowerCase().includes('mobile');
                    const carrierName = isMobile ? data.currentCarrierName : data.originalCarrierName;
                    resultContainer.className = 'mt-4 p-4 rounded-lg border bg-green-50 border-green-200';
                    resultText.innerHTML = `
                        <span class="font-bold text-green-800 block mb-1">✓ Validated Number</span>
                        <span class="text-green-700 block"><strong>Number:</strong> ${data.formattedNumber}</span>
                        <span class="text-green-700 block"><strong>Country:</strong> ${data.country}</span>
                        <span class="text-green-700 block"><strong>Network Type:</strong> ${data.networkType}</span>
                        <span class="text-green-700 block"><strong>Carrier:</strong> ${carrierName}</span>
                    `;
                } else {
                    const countryHint = !selectedCountry
                        ? `<span class="text-amber-700 block mt-1 text-xs">💡 Have you selected a country code? Use the dropdown on the left.</span>`
                        : '';
                    resultContainer.className = 'mt-4 p-4 rounded-lg border bg-red-50 border-red-200';
                    resultText.innerHTML = `
                        <span class="font-bold text-red-800">Invalid Format</span><br>
                        <span class="text-red-700">Please check the number and try again.</span>
                        ${countryHint}
                    `;
                }
            } catch (error) {
                resultContainer.classList.remove('hidden');
                resultContainer.className = 'mt-4 p-4 rounded-lg border bg-slate-100 border-slate-300';
                resultText.innerText = `Error: ${error.message}`;
            } finally {
                btn.innerText = 'Validate Number';
                btn.disabled = false;
                btn.classList.remove('opacity-75');
            }
        });
    </script>
</body>

</html>
